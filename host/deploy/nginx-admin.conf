# LAN-only exposure for the admin app (§7). The backend itself listens on
# 127.0.0.1:8080; this makes it reachable from the LAN subnet ONLY.
#
#   cp nginx-admin.conf /etc/nginx/conf.d/whitelist-admin.conf
#   # adjust the interface address + subnet, then: nginx -t && systemctl reload nginx
#
# Remember: this blocks outside CONNECTIONS. The app's own Origin/Host checks
# + the X-Admin-Request header handle hostile pages in the admin's browser.

server {
    listen 192.168.1.10:80;   # the LAN interface address — NOT 0.0.0.0
    server_name _;

    allow 192.168.1.0/24;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
